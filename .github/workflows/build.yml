name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Gradle 6 / AGP 4 builds with JDK 11; the SDK tools need JDK 17.
      # The last one listed (17) becomes the default; the build step switches to 11.
      - name: Set up JDK 11 and 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17

      - name: Install SDK packages (NDK, CMake, build tools)
        run: |
          # Use the SDK that ships with the runner image
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;21.0.6113669" "cmake;3.10.2.4988404" \
                     "build-tools;29.0.2" "build-tools;30.0.3" \
                     "platforms;android-29" "platforms;android-30"

      - name: Build 64-bit APK
        run: |
          export JAVA_HOME="$JAVA_HOME_11_X64"
          # The runner defaults to the newest NDK; this code needs NDK 21
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.0.6113669" >> local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleBlackBox64Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xpose-Device-arm64
          path: app/build/outputs/apk/BlackBox64/release/*.apk
