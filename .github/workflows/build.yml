name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (NDK, CMake, build tools)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;21.0.6113669" "cmake;3.10.2.4988404" \
                     "build-tools;29.0.2" "build-tools;30.0.3" \
                     "platforms;android-29" "platforms;android-30"

      - name: Build 64-bit APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleBlackBox64Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xpose-Device-arm64
          path: app/build/outputs/apk/BlackBox64/release/*.apk
